name: YanShu Upload Existing IPA to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Actions run ID containing the signed YanShu-AppStore artifact'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: appstore-existing-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APPLE_BUNDLE_ID: com.example.yanshu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download existing signed IPA
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: YanShu-AppStore-*
          path: build/ci-artifacts
          merge-multiple: true

      - name: Validate IPA and Apple API access
        env:
          ASC_PREFLIGHT_ONLY: '1'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tool/ci/verify_app_store_build.py

      - name: Upload IPA to App Store Connect
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ci-artifacts/YanShu-AppStore.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          wait-for-processing: 'false'

      - name: Verify Apple processing result
        timeout-minutes: 18
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tool/ci/verify_app_store_build.py
