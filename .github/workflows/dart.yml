name: YanShu iOS IPA Build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique build number; must exceed prior uploads for the same App Store app'
        type: string
        default: ''
        required: false
      upload_testflight:
        description: 'Upload the signed build to App Store Connect / TestFlight'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build signed App Store IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: 53KZ8VG93S
      APPLE_BUNDLE_ID: com.example.yanshu
      COCOAPODS_DISABLE_STATS: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Select App Store compatible Xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check App Store Connect credentials
        if: ${{ inputs.upload_testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" || { echo 'Missing ASC_KEY_ID secret'; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo 'Missing ASC_ISSUER_ID secret'; exit 1; }
          test -n "$ASC_PRIVATE_KEY" || { echo 'Missing ASC_PRIVATE_KEY secret'; exit 1; }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          gem install cocoapods -v 1.16.2 --no-document
          gem install xcodeproj -v 1.27.0 --no-document
          flutter config --enable-swift-package-manager
          flutter --version
          xcodebuild -version
          flutter pub get --enforce-lockfile
          python3 tool/check_soninote_sdk.py

      - name: Import signing certificate into temporary keychain
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12_BASE64" || { echo 'Missing P12_BASE64 secret'; exit 1; }
          test -n "$P12_PASSWORD" || { echo 'Missing P12_PASSWORD secret'; exit 1; }
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = ''.join(os.environ['P12_BASE64'].split())
          (Path(os.environ['RUNNER_TEMP']) / 'yanshu-signing.p12').write_bytes(base64.b64decode(value, validate=True))
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/yanshu-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/yanshu-signing.p12" -P "$P12_PASSWORD" \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

      - name: Validate and install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          RECORDING_MOBILEPROVISION_BASE64: ${{ secrets.RECORDING_MOBILEPROVISION_BASE64 }}
        run: python3 tool/ci/prepare_ios_profile.py

      - name: Prepare cloud scheme and manual signing
        run: ruby tool/ci/prepare_ios_project.rb

      - name: Analyze Flutter source
        run: flutter analyze --no-pub

      - name: Build signed cloud IPA
        env:
          IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
        run: |
          set -euo pipefail
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'build_number must be a positive integer'; exit 1; }
          flutter build ipa --release --flavor cloud --target lib/main.dart \
            --dart-define-from-file=config/cloud.json \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      - name: Collect IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          files = list(Path('build/ios/ipa').glob('*.ipa'))
          if len(files) != 1:
              raise SystemExit(f'Expected one exported IPA, found {len(files)}')
          Path('build/ci-artifacts').mkdir(parents=True, exist_ok=True)
          shutil.copy2(files[0], 'build/ci-artifacts/YanShu-AppStore.ipa')
          PY

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: YanShu-AppStore-${{ github.run_number }}
          path: build/ci-artifacts/YanShu-AppStore.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA to App Store Connect
        if: ${{ inputs.upload_testflight }}
        timeout-minutes: 25
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/ci-artifacts/YanShu-AppStore.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
          wait-for-processing: 'false'

      - name: Verify Apple processing result
        if: ${{ inputs.upload_testflight }}
        timeout-minutes: 18
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tool/ci/verify_app_store_build.py

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${RECORDING_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$RECORDING_PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$RECORDING_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/agenote-recording.mobileprovision"
          rm -f "$RUNNER_TEMP/yanshu-signing.p12" "$RUNNER_TEMP/yanshu.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
